<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="main-page">
    <div class="top-picture-cont">
      <img class="task-img" src="./eisenhower-matrix.jpg">
      <a
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
      Want more details?
      </a>
    </div>
    <div class="centered-main-element">
        <p id="add-elements-to-list">
          <label for="new-task" class="label">Add Item</label>
          <div class="task-row-wrapper">
            <input
              id="new-task"
              class="task input-field"
              type="text"
            >
            <button class="task-btn">Add</button>
          </div>
        </p>
        <h3 class="task-title">Todo</h3>
        <ul id="incomplete-tasks">
          <li class="task-item">
            <input
              type="checkbox"
              class="input-field"
            >
            <label class="task label">Pay Bills</label>
            <input
              type="text"
              class="task input-field"
            >
            <button class="task-btn edit">Edit</button>
            <button class="task-btn delete">
              <img class="task-img" src="./remove.svg">
            </button>
          </li>
          <li class="edit-mode task-item">
            <input
              type="checkbox"
              class="input-field"
            >
            <label class="task label">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="task input-field"
            >
            <button class="task-btn edit">Save</button>
            <button class="task-btn delete">
              <img class="task-img" src="./remove.svg">
            </button>
          </li>
        </ul>
        <h3 class="task-title">Completed</h3>
        <ul id="completed-tasks">
          <li class="task-item">
            <input
              type="checkbox"
              class="input-field"
              checked
            >
            <label class="task label">See the Doctor</label>
            <input
              type="text"
              class="task input-field"
            >
            <button class="task-btn edit">Edit</button>
            <button class="task-btn delete">
              <img class="task-img" src="./remove.svg">
            </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
